[SERVICE]
    Log_Level    debug
    Parsers_File /dev/null

[INPUT]
    Name  dummy
    Tag   test.*
    Dummy {"log": "hello"}
    Rate  1

[OUTPUT]
    Name                                          gardener
    Match                                         test.*
    LogLevel                                      debug
    SeedType                                      otlp_http
    ShootType                                     otlp_grpc
    Endpoint                                      localhost:4317
    EndpointUrl                                   http://localhost:4317
    EndpointUrlPath                               /v1/logs
    Insecure                                      true
    Compression                                   1
    Timeout                                       10s
    Origin                                        test-origin
    HostnameValue                                 test-host
    FallbackToTagWhenMetadataIsMissing            true
    DropLogEntryWithoutK8sMetadata                true
    TagKey                                        custom_tag
    TagPrefix                                     custom\.prefix
    TagExpression                                 \.([^_]+)_([^_]+)_(.+)-([a-z0-9]{64})\.log$
    DynamicHostPath                               {"kubernetes": {"namespace_name": "namespace"}}
    DynamicHostPrefix                             logging.
    DynamicHostSuffix                             .svc.cluster.local:4317
    DynamicHostRegex                              ^shoot-
    ControllerSyncTimeout                         120s
    WatchOpenTelemetryCollector                   true
    OpenTelemetryCollectorLabelSelector           app=otel
    OpenTelemetryCollectorNamespaceLabelSelector  env=prod
    SendLogsToShootWhenIsInCreationState          true
    SendLogsToShootWhenIsInReadyState             true
    SendLogsToShootWhenIsInHibernatingState       false
    SendLogsToShootWhenIsInHibernatedState        false
    SendLogsToShootWhenIsInWakingState            true
    SendLogsToShootWhenIsInDeletionState          true
    SendLogsToShootWhenIsInDeletedState           false
    SendLogsToShootWhenIsInRestoreState           true
    SendLogsToShootWhenIsInMigrationState         false
    SendLogsToSeedWhenShootIsInCreationState      true
    SendLogsToSeedWhenShootIsInReadyState         false
    SendLogsToSeedWhenShootIsInHibernatingState   false
    SendLogsToSeedWhenShootIsInHibernatedState    false
    SendLogsToSeedWhenShootIsInWakingState        false
    SendLogsToSeedWhenShootIsInDeletionState      true
    SendLogsToSeedWhenShootIsInDeletedState       true
    SendLogsToSeedWhenShootIsInRestoreState       true
    SendLogsToSeedWhenShootIsInMigrationState     true
    DQueDir                                       /tmp/test-dque
    DQueSegmentSize                               100
    DQueSync                                      full
    DQueName                                      test-queue
    DQueBatchProcessorMaxQueueSize                256
    DQueBatchProcessorMaxBatchSize                64
    DQueBatchProcessorExportTimeout               15s
    DQueBatchProcessorExportInterval              5s
    DQueBatchProcessorExportBufferSize            32
    UseSDKBatchProcessor                          true
    SDKBatchMaxQueueSize                          1024
    SDKBatchExportTimeout                         20s
    SDKBatchExportInterval                        3s
    SDKBatchExportMaxBatchSize                    128
    RetryEnabled                                  true
    RetryInitialInterval                          2s
    RetryMaxInterval                              60s
    RetryMaxElapsedTime                           5m
    ThrottleEnabled                               true
    ThrottleRequestsPerSec                        50
    TLSServerName                                 test-server
    TLSInsecureSkipVerify                         true
    TLSMinVersion                                 1.2
    TLSMaxVersion                                 1.3
